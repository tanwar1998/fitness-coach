services:
  db:
    image: postgres:16-alpine
    container_name: fitcoach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcoach
      POSTGRES_PASSWORD: root
      POSTGRES_DB: fitcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
