services:
  - type: web
    name: fitness-coach
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fitcoach-db
          property: connectionString
      # - key: AI_PROVIDER
      #   sync: false
      # - key: GOOGLE_GEMINI_KEY
      #   sync: false
      # - key: GEMINI_MODEL
      #   value: gemini-3.5-flash
      # - key: GROK_API_KEY
      #   sync: false
      # - key: GROK_MODEL
      #   value: grok-4
      # - key: GROK_BASE_URL
      #   value: https://api.x.ai/v1

databases:
  - name: fitcoach-db
    databaseName: fitcoach
    user: fitcoach
    plan: free
    region: oregon
    postgresMajorVersion: "16"
